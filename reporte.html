<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Novedades</title>
</head>
<body>

    <header>
        <h1>Reporte de Novedades</h1>
    </header>

    <main>
        <section>
            <h2>Privacidad</h2>
            <p>Los datos que escribas en este formulario solo se usan para atender tu reporte.</p>
        </section>

        <section>
            <h2>Detalles del Reporte</h2>

            <form action="#" method="POST">
                <!-- Campo de Texto Básico -->
                <label for="nombreCompleto">Nombre del Aprendiz:</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" required>
                <br><br>

                <!-- Lista Desplegable (Combobox) -->
                <label for="tipoNovedad">Tipo de Novedad:</label>
                <select id="tipoNovedad" name="tipoNovedad" required>
                    <option value="">Seleccione una categoría...</option>
                    <option value="hardware">Daño en equipo de cómputo</option>
                    <option value="software">Falla de software o red</option>
                    <option value="infraestructura">Daño en mobiliario o electricidad</option>
                </select>
                <br><br>
                                <!-- Casillas de verificación (Checkboxes) accesibles -->
                <fieldset>
                    <legend>Elementos específicos afectados:</legend>

                    <input type="checkbox" id="afectaMonitor" name="afectados" value="monitor">
                    <label for="afectaMonitor">Monitor o Pantalla</label><br>

                    <input type="checkbox" id="afectaTeclado" name="afectados" value="teclado">
                    <label for="afectaTeclado">Teclado o Mouse</label><br>

                    <input type="checkbox" id="afectaTorre" name="afectados" value="torre">
                    <label for="afectaTorre">Torre / CPU</label>
                </fieldset>
                <br>

                <!-- Área de texto (Textarea) -->
                <label for="descripcion">Descripción detallada de la falla:</label><br>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Ej: El equipo de la mesa 3 no enciende..." required></textarea>
                <br><br>
                                <!-- Carga de Imagen -->
                <label for="evidencia">Adjuntar fotografía de evidencia (Obligatorio):</label>
                <input type="file" id="evidencia" name="evidencia" accept="image/*" required>
                <br><br>

                <!-- Botón de Envío -->
                <button type="submit">Registrar Novedad</button>

            </form>
        </section>
    </main>
        <footer>
        <p>Documento elaborado por: Tu Nombre Completo</p>
    </footer>

</body>
</html>
